$kind: http-request
name: 'Patch Owner Profile'
order: 2000
method: PATCH
url: '{{base_url}}/{{api_prefix}}/owners/me/'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{owner_access_token}}'
body:
  type: json
  content: |-
    {
      "firstname": "{{owner_firstname}}",
      "phone": "{{owner_phone}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Owner profile patch returns 200", () => pm.response.to.have.status(200));
