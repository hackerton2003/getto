$kind: http-request
name: 'Get Owner Profile'
order: 1000
method: GET
url: '{{base_url}}/{{api_prefix}}/owners/me/'
headers:
  - key: Authorization
    value: 'Bearer {{owner_access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Owner profile returns 200", () => pm.response.to.have.status(200));
