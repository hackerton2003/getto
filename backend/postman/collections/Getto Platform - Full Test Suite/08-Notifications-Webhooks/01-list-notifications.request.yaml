$kind: http-request
name: 'List Notifications'
order: 1000
method: GET
url: '{{base_url}}/{{api_prefix}}/notifications/'
headers:
  - key: Authorization
    value: 'Bearer {{customer_access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("List notifications returns 200", function () {
        pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      const results = Array.isArray(json) ? json : (json.results || []);
      if (results.length > 0) {
        pm.environment.set("notification_id", results[0].id);
      }
