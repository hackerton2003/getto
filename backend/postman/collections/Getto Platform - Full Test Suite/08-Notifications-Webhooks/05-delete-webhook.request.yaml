$kind: http-request
name: 'Delete Webhook Subscription Created Above'
order: 5000
method: DELETE
url: '{{base_url}}/{{api_prefix}}/webhooks/'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{owner_access_token}}'
body:
  type: json
  content: |-
    { "subscription_id": {{webhook_id}} }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Webhook delete returns 204", () => pm.response.to.have.status(204));
