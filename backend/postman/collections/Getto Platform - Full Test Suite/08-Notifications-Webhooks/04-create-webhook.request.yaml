$kind: http-request
name: 'Create Webhook Subscription'
order: 4000
method: POST
url: '{{base_url}}/{{api_prefix}}/webhooks/'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{owner_access_token}}'
body:
  type: json
  content: |-
    {
      "target_url": "{{webhook_target_url}}",
      "event_types": ["verification.submitted"]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Create webhook returns 201", function () {
        pm.response.to.have.status(201);
      });
      const body = pm.response.json();
      if (body.id) pm.environment.set("webhook_id", body.id);
      if (body.secret) pm.environment.set("webhook_secret", body.secret);
