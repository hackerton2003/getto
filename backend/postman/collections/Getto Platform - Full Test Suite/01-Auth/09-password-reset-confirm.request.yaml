$kind: http-request
name: 'Confirm Password Reset (paste token from console email)'
order: 9000
method: POST
url: '{{base_url}}/{{api_prefix}}/auth/password-reset/confirm/'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "{{password_reset_token}}",
      "new_password": "{{customer_password}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.environment.get("password_reset_token")) {
        pm.execution.skipRequest();
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Password reset confirmation returns 204", () => pm.response.to.have.status(204));
