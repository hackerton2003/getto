$kind: http-request
name: 'Password Reset - Request'
order: 7000
method: POST
url: '{{base_url}}/{{api_prefix}}/auth/password-reset/'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "account_type": "customer",
      "email": "{{customer_email}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Password reset request accepted (200 or 202)", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 202]);
      });
