$kind: http-request
name: 'Get Room Detail'
order: 7000
method: GET
url: '{{base_url}}/{{api_prefix}}/rooms/{{room_id}}/'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Get room detail returns 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Room has id and price", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
      });
