$kind: http-request
name: 'List Rooms (Public)'
order: 6000
method: GET
url: '{{base_url}}/{{api_prefix}}/rooms/'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("List rooms returns 200", function () {
        pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      const results = Array.isArray(json) ? json : (json.results || []);
      if (results.length > 0) {
        pm.environment.set("room_id", results[0].id);
      }
