$kind: http-request
name: 'Owner - List My Properties'
order: 3000
method: GET
url: '{{base_url}}/{{api_prefix}}/owners/me/properties/'
headers:
  - key: Authorization
    value: 'Bearer {{owner_access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Owner list properties returns 200", function () {
        pm.response.to.have.status(200);
      });
      const body = pm.response.json();
      const rows = Array.isArray(body) ? body : (body.results || []);
      if (rows.length) pm.environment.set("property_id", rows[0].id);
