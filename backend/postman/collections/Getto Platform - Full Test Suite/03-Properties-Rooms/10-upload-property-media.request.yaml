$kind: http-request
name: 'Owner - Upload Property Image (select file)'
order: 10000
method: POST
url: '{{base_url}}/{{api_prefix}}/owners/me/properties/{{property_id}}/media/'
headers:
  - key: Authorization
    value: 'Bearer {{owner_access_token}}'
body:
  type: form-data
  content:
    - key: file
      type: file
      src: ''
    - key: type
      type: text
      value: image
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (pm.environment.get("run_file_uploads") !== "true") pm.execution.skipRequest();
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Property media upload returns 201", () => pm.response.to.have.status(201));
      const body = pm.response.json();
      if (body.id) pm.environment.set("property_media_id", body.id);
