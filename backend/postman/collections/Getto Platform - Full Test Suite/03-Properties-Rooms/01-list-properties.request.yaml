$kind: http-request
name: 'List Properties (Public)'
order: 1000
method: GET
url: '{{base_url}}/{{api_prefix}}/properties/'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("List properties returns 200", function () {
        pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      const results = Array.isArray(json) ? json : (json.results || []);
      if (results.length > 0) {
        pm.environment.set("verified_property_id", results[0].id);
        if (!pm.environment.get("property_id")) pm.environment.set("property_id", results[0].id);
      }
