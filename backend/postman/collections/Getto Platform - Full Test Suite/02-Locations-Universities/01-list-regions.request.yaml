$kind: http-request
name: 'List Regions'
order: 1000
method: GET
url: '{{base_url}}/{{api_prefix}}/locations/regions/'
headers:
  - key: Authorization
    value: 'Bearer {{staff_access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("List regions returns 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response is an array or paginated object", function () {
        const json = pm.response.json();
        pm.expect(json).to.be.oneOf([
          json instanceof Array ? json : null,
          typeof json === 'object' ? json : null
        ]);
      });
      const json = pm.response.json();
      const results = Array.isArray(json) ? json : (json.results || []);
      if (results.length > 0) {
        pm.environment.set("region_id", results[0].id);
      }
