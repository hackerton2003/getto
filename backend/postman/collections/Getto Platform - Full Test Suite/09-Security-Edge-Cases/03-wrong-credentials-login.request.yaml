$kind: http-request
name: 'Wrong Credentials Login (should fail)'
order: 3000
method: POST
url: '{{base_url}}/{{api_prefix}}/auth/login/'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "account_type": "customer",
      "email": "{{customer_email}}",
      "password": "WrongPassword999!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Wrong credentials returns 400 or 401", function () {
        pm.expect(pm.response.code).to.be.oneOf([400, 401]);
      });
      pm.test("No access token in error response", function () {
        const json = pm.response.json();
        pm.expect(json).to.not.have.property("access");
      });
