$kind: http-request
name: 'Owner - Confirm Booking'
order: 3000
method: POST
url: '{{base_url}}/{{api_prefix}}/owners/me/bookings/{{booking_id}}/confirm/'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{owner_access_token}}'
body:
  type: json
  content: '{}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Owner can confirm booking", function () {
        pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      if (json.status) {
        pm.environment.set("booking_status", json.status);
      }
