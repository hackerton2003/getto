$kind: http-request
name: 'Cancel Booking'
order: 7000
method: POST
url: '{{base_url}}/{{api_prefix}}/bookings/{{booking_id}}/cancel/'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{customer_access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Cancel booking returns 200 or 201", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Response indicates cancellation", function () {
        const json = pm.response.json();
        const status = (json.status || "").toLowerCase();
        pm.expect(status).to.match(/cancel/);
      });
      const json = pm.response.json();
      if (json.status) {
        pm.environment.set("booking_status", json.status);
      }
