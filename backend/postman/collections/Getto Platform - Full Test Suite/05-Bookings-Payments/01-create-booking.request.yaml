$kind: http-request
name: 'Create Booking'
order: 1000
method: POST
url: '{{base_url}}/{{api_prefix}}/bookings/'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{customer_access_token}}'
body:
  type: json
  content: |-
    {
      "room_id": {{room_id}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Create booking returns 201", function () {
        pm.response.to.have.status(201);
      });
      pm.test("Booking has id and status", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("id");
        pm.expect(json).to.have.property("status");
      });
      const json = pm.response.json();
      if (json.id) {
        pm.environment.set("booking_id", json.id);
        pm.environment.set("booking_status", json.status);
      }
