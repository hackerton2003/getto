$kind: http-request
name: 'Create Payment'
order: 4000
method: POST
url: '{{base_url}}/{{api_prefix}}/payments/'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{customer_access_token}}'
body:
  type: json
  content: |-
    {
      "booking_id": {{booking_id}},
      "payment_method": "mobile_money"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Create payment returns 201 or 200", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      const json = pm.response.json();
      if (json.id) {
        pm.environment.set("payment_id", json.id);
      }
