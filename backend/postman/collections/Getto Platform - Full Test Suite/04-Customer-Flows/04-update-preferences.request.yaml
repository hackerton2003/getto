$kind: http-request
name: 'Update Customer Preferences'
order: 4000
method: PUT
url: '{{base_url}}/{{api_prefix}}/customers/me/preferences/'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{customer_access_token}}'
body:
  type: json
  content: |-
    {
      "max_price": 200000,
      "preferred_room_type": "single"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Update preferences returns 200", function () {
        pm.response.to.have.status(200);
      });
