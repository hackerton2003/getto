$kind: http-request
name: 'Update Customer Profile'
order: 2000
method: PATCH
url: '{{base_url}}/{{api_prefix}}/customers/me/'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{customer_access_token}}'
body:
  type: json
  content: |-
    {
      "firstname": "UpdatedFirst"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Update profile returns 200", function () {
        pm.response.to.have.status(200);
      });
