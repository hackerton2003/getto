$kind: http-request
name: 'Get Customer Profile'
order: 1000
method: GET
url: '{{base_url}}/{{api_prefix}}/customers/me/'
headers:
  - key: Authorization
    value: 'Bearer {{customer_access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Get profile returns 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Profile has email", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("email");
      });
      pm.test("Password not exposed", function () {
        const json = pm.response.json();
        pm.expect(json).to.not.have.property("password");
      });
