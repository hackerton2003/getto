$kind: http-request
name: 'List Favourites'
order: 6000
method: GET
url: '{{base_url}}/{{api_prefix}}/customers/me/favourites/'
headers:
  - key: Authorization
    value: 'Bearer {{customer_access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("List favourites returns 200", function () {
        pm.response.to.have.status(200);
      });
