$kind: http-request
name: 'List Visitor Logs'
order: 7000
method: GET
url: '{{base_url}}/{{api_prefix}}/system/visitor-logs/'
headers:
  - key: Authorization
    value: 'Bearer {{staff_access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("List visitor logs returns 200", function () {
        pm.response.to.have.status(200);
      });
