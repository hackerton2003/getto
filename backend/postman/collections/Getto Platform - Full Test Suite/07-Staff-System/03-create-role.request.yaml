$kind: http-request
name: 'Role Catalog Rejects Writes'
order: 3000
method: POST
url: '{{base_url}}/{{api_prefix}}/staff/roles/'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{staff_access_token}}'
body:
  type: json
  content: |-
    {
      "name": "Test Role",
      "description": "Automated test role"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Roles are a read-only catalog", function () {
        pm.response.to.have.status(405);
      });
