$kind: http-request
name: 'List Permissions'
order: 4000
method: GET
url: '{{base_url}}/{{api_prefix}}/staff/permissions/'
headers:
  - key: Authorization
    value: 'Bearer {{staff_access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("List permissions returns 200", function () {
        pm.response.to.have.status(200);
      });
