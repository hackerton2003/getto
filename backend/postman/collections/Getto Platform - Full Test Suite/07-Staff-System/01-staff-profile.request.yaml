$kind: http-request
name: 'Staff - Get My Profile'
order: 1000
method: GET
url: '{{base_url}}/{{api_prefix}}/staff/me/'
headers:
  - key: Authorization
    value: 'Bearer {{staff_access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Staff profile returns 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Staff profile has email", function () {
        const json = pm.response.json();
        pm.expect(json).to.have.property("email");
      });
