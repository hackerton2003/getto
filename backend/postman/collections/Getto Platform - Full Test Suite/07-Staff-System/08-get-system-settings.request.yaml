$kind: http-request
name: 'Get System Settings'
order: 8000
method: GET
url: '{{base_url}}/{{api_prefix}}/system/settings/'
headers:
  - key: Authorization
    value: 'Bearer {{staff_access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Get system settings returns 200", function () {
        pm.response.to.have.status(200);
      });
